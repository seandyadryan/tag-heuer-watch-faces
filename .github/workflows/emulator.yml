name: Emulator smoke checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :wear:assembleDebug :companion:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apks
          path: |
            wear/build/outputs/apk/debug/*.apk
            companion/build/outputs/apk/debug/*.apk
          retention-days: 7
  smoke:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 35
            target: google_apis
            profile: pixel_6
          - device: wear
            api: 33
            target: android-wear
            profile: wearos_small_round
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: emulator-apks
          path: packages
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/emulator-smoke.sh ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ matrix.device }}
          path: evidence/
          retention-days: 14
