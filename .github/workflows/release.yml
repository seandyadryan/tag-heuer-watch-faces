name: Signed release bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/watch-face.jks"
          chmod 600 "$RUNNER_TEMP/watch-face.jks"
      - name: Validate and create signed AAB and APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/watch-face.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          python3 tools/verify_project.py
          ./gradlew :wear:lintRelease :companion:lintRelease :wear:bundleRelease :companion:bundleRelease :wear:assembleRelease :companion:assembleRelease --console=plain
          python3 tools/verify_project.py
      - uses: actions/upload-artifact@v4
        with:
          name: signed-play-store-bundles
          path: |
            wear/build/outputs/bundle/release/*.aab
            companion/build/outputs/bundle/release/*.aab
            wear/build/outputs/apk/release/*.apk
            companion/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/watch-face.jks"
